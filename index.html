<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1226">
<title>Speed test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Speed test</h1>
      <p class="muted">Test your speed and walk around to find the strongest and weakest spots.</p>
    </div>
    <div class="tools">
      <span id="connType" class="badge" hidden></span>
      <svg id="wifi" class="wifi" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Wi-Fi signal">
        <title>Wi-Fi signal</title>
        <path class="w w3" d="M2 8.8a15 15 0 0 1 20 0"/>
        <path class="w w2" d="M5.5 12.6a10 10 0 0 1 13 0"/>
        <path class="w w1" d="M9 16.2a5 5 0 0 1 6 0"/>
        <circle class="w w0" cx="12" cy="19.6" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </div>
  </header>

  <section class="gauges">
    <div class="card gcard">
      <div class="label">Download</div>
      <svg class="gauge" viewBox="0 0 200 175" aria-hidden="true">
        <defs>
          <linearGradient id="gdl" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
        </defs>
        <path class="track" pathLength="100" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
        <path id="dlArc" class="arc" pathLength="100" stroke="url(#gdl)" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
        <text id="dlMin" class="tick" x="40" y="172" text-anchor="middle">0</text>
        <text id="dlMax" class="tick" x="160" y="172" text-anchor="middle">100</text>
      </svg>
      <div class="gval"><span id="dl">–</span><small>Mbps</small></div>
    </div>
    <div class="card gcard">
      <div class="label">Upload</div>
      <svg class="gauge" viewBox="0 0 200 175" aria-hidden="true">
        <defs>
          <linearGradient id="gul" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
        </defs>
        <path class="track" pathLength="100" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
        <path id="ulArc" class="arc" pathLength="100" stroke="url(#gul)" d="M 43.43 156.57 A 80 80 0 1 1 156.57 156.57"/>
        <text class="tick" x="40" y="172" text-anchor="middle">0</text>
        <text id="ulMax" class="tick" x="160" y="172" text-anchor="middle">100</text>
      </svg>
      <div class="gval"><span id="ul">–</span><small>Mbps</small></div>
    </div>
  </section>

  <section class="grid">
    <div class="card stat"><div class="label">Ping</div><div class="big"><span id="ping">–</span><small>ms</small></div></div>
    <div class="card stat"><div class="label">Jitter</div><div class="big"><span id="jit">–</span><small>ms</small></div></div>
  </section>

  <section class="card">
    <div class="row between wrapx">
      <div>
        <div class="label">Signal quality (vs your best)</div>
        <div class="big"><span id="q">–</span><small>/ 100</small> <span id="qLabel" class="badge">Idle</span></div>
      </div>
      <div class="row gap wrapx">
        <button id="testBtn" class="btn primary">Run speed test</button>
        <button id="liveBtn" class="btn">Start live mode</button>
        <button id="resetBtn" class="btn ghost" title="Forget the best reading">Reset best</button>
      </div>
    </div>
    <div class="bar"><i id="qBar"></i></div>
    <div id="qNote" class="muted small"></div>
    <div id="status" class="muted small">Ready.</div>
  </section>
  <footer class="muted small center">Tests use Cloudflare’s public speed endpoints. Results include your ISP’s limits.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
