<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Speed test</h1>
      <p class="muted">Test your speed and walk around to find the strongest and weakest spots.</p>
    </div>
    <div class="tools">
    <svg id="wifi" class="wifi" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Wi-Fi signal">
          <title>Wi-Fi signal</title>
          <path class="w w3" d="M2 8.8a15 15 0 0 1 20 0"/>
          <path class="w w2" d="M5.5 12.6a10 10 0 0 1 13 0"/>
          <path class="w w1" d="M9 16.2a5 5 0 0 1 6 0"/>
          <circle class="w w0" cx="12" cy="19.6" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
    <button id="themeBtn" class="btn icon" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    </div>
  </header>
  <section class="grid">
    <div class="card stat"><div class="label">Download</div><div class="big"><span id="dl">–</span><small>Mbps</small></div></div>
    <div class="card stat"><div class="label">Upload</div><div class="big"><span id="ul">–</span><small>Mbps</small></div></div>
    <div class="card stat"><div class="label">Ping</div><div class="big"><span id="ping">–</span><small>ms</small></div></div>
    <div class="card stat"><div class="label">Jitter</div><div class="big"><span id="jit">–</span><small>ms</small></div></div>
  </section>

  <section class="card">
    <div class="row between wrapx">
      <div>
        <div class="label">Signal quality (vs your best)</div>
        <div class="big"><span id="q">–</span><small>/ 100</small> <span id="qLabel" class="badge">Idle</span></div>
      </div>
      <div class="row gap wrapx">
        <button id="testBtn" class="btn primary">Run speed test</button>
        <button id="liveBtn" class="btn">Start live mode</button>
        <button id="resetBtn" class="btn ghost" title="Forget the best reading">Reset best</button>
      </div>
    </div>
    <div class="bar"><i id="qBar"></i></div>
    <div id="qNote" class="muted small"></div>
    <div id="status" class="muted small">Ready.</div>
    <canvas id="chart" height="220"></canvas>
    <div class="legend small muted"><span><i class="dot a"></i>Download (Mbps)</span><span><i class="dot b"></i>Quality</span></div>
  </section>
  <footer class="muted small center">Tests use Cloudflare’s public speed endpoints. Results include your ISP’s limits.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
